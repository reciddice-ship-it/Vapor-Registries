name: Update State Vapor Registries

on:
  workflow_dispatch:
    inputs:
      state:
        description: "Optional state abbreviation to run, e.g. NC or NE. Leave blank to run all enabled states."
        required: false
        type: string
  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r vapor-registry-multi-state/requirements.txt

      - name: Fetch registries and calculate changes
        run: |
          if [ -n "${{ github.event.inputs.state }}" ]; then
            python vapor-registry-multi-state/scripts/monitor_registries.py --state "${{ github.event.inputs.state }}"
          else
            python vapor-registry-multi-state/scripts/monitor_registries.py
          fi

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vapor-registry-multi-state/docs/data
          if git diff --staged --quiet; then
            echo "No registry data changes to commit."
          else
            git commit -m "Update state vapor registry data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: vapor-registry-multi-state/docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
